<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint con Flechas caambio 7:32</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .info {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .info p {
            margin: 5px 0;
        }

        canvas {
            display: block;
            border: 3px solid #667eea;
            border-radius: 10px;
            cursor: crosshair;
            background: white;
            margin: 20px auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        #clearBtn {
            background: #ff6b6b;
            color: white;
        }

        #clearBtn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        #downloadBtn {
            background: #51cf66;
            color: white;
        }

        #downloadBtn:hover {
            background: #40c057;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.3);
        }

        .color-picker,
        .size-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        #colorInput {
            width: 50px;
            height: 40px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        #sizeInput {
            width: 100px;
            cursor: pointer;
        }

        #sizeValue {
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            canvas {
                max-width: 100%;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paint con Flechas del Teclado</h1>
        <div class="info">
            <p>✅ <strong>Haz clic en el canvas</strong> para enfocarlo</p>
            <p>⌨️ Usa las <strong>flechas del teclado</strong> para mover el pincel</p>
            <p>🖱️ <strong>Espacio</strong> para dibujo automático • <strong>Clic y arrastra</strong> para dibujar</p>
        </div>
        <canvas id="canvas"></canvas>
        <div class="controls">
            <button id="clearBtn">Limpiar</button>
            <button id="downloadBtn">Descargar</button>
            <div class="color-picker">
                <label for="colorInput">Color:</label>
                <input type="color" id="colorInput" value="#000000">
            </div>
            <div class="size-picker">
                <label for="sizeInput">Tamaño:</label>
                <input type="range" id="sizeInput" min="1" max="50" value="5">
                <span id="sizeValue">5</span>px
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colorInput = document.getElementById('colorInput');
        const sizeInput = document.getElementById('sizeInput');
        const sizeValue = document.getElementById('sizeValue');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        canvas.width = Math.min(window.innerWidth - 40, 800);
        canvas.height = 500;
        canvas.tabIndex = 1;

        let isDrawing = false;
        let cursorX = canvas.width / 2;
        let cursorY = canvas.height / 2;
        let cursorVisible = true;

        const keys = {};

        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const drawCursor = () => {
            ctx.save();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(cursorX, cursorY, parseInt(sizeInput.value) / 2, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.moveTo(cursorX - 10, cursorY);
            ctx.lineTo(cursorX + 10, cursorY);
            ctx.moveTo(cursorX, cursorY - 10);
            ctx.lineTo(cursorX, cursorY + 10);
            ctx.stroke();
            ctx.restore();
        };

        const saveState = () => {
            return canvas.toDataURL();
        };

        let undoStack = [saveState()];
        let drawingPixels = null;

        const redrawWithCursor = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (drawingPixels) {
                ctx.putImageData(drawingPixels, 0, 0);
            }

            drawCursor();
        };

        const moveCursor = (dx, dy) => {
            cursorX = Math.max(0, Math.min(canvas.width, cursorX + dx));
            cursorY = Math.max(0, Math.min(canvas.height, cursorY + dy));
        };

        canvas.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            const step = 5;

            if (e.key === 'ArrowUp') {
                moveCursor(0, -step);
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                moveCursor(0, step);
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                moveCursor(-step, 0);
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                moveCursor(step, 0);
                e.preventDefault();
            } else if (e.key === ' ') {
                e.preventDefault();
                isDrawing = !isDrawing;
            }
        });

        canvas.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('focus', () => {
            canvas.style.boxShadow = '0 5px 15px rgba(102, 126, 234, 0.5)';
        });

        canvas.addEventListener('blur', () => {
            canvas.style.boxShadow = '0 5px 15px rgba(0, 0, 0, 0.1)';
        });

        canvas.addEventListener('mousedown', () => {
            isDrawing = true;
            canvas.focus();
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
            drawingPixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            cursorX = e.clientX - rect.left;
            cursorY = e.clientY - rect.top;
            canvas.focus();
        });

        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        sizeInput.addEventListener('input', (e) => {
            sizeValue.textContent = e.target.value;
        });

        const draw = () => {
            if (isDrawing) {
                ctx.fillStyle = colorInput.value;
                ctx.beginPath();
                ctx.arc(cursorX, cursorY, parseInt(sizeInput.value) / 2, 0, Math.PI * 2);
                ctx.fill();
                drawingPixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
        };

        const animate = () => {
            draw();
            redrawWithCursor();
            requestAnimationFrame(animate);
        };

        animate();

        window.addEventListener('load', () => {
            canvas.focus();
        });

        clearBtn.addEventListener('click', () => {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawingPixels = null;
            undoStack = [saveState()];
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = `paint-${Date.now()}.png`;
            link.click();
        });

        window.addEventListener('resize', () => {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            canvas.width = Math.min(window.innerWidth - 40, 800);
            ctx.drawImage(tempCanvas, 0, 0);
        });
    </script>
</body>
</html>
